name: Build Dev MPP

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'gradle/**'
      - '.github/workflows/build-dev-mpp.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'

permissions:
  contents: read
  packages: read

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-dev-mpp:
    name: Build and verify Dev MPP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Morphe patch project
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew -Pversion=2.0.0-dev.${GITHUB_RUN_NUMBER} clean buildAndroid :patches:generatePatchesList --no-daemon --stacktrace

      - name: Validate MPP output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dev-mpp-output
          mapfile -t artifacts < <(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*-sources.mpp' ! -name '*-javadoc.mpp' -print | sort)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No .mpp was generated under patches/build/libs" >&2
            find patches/build -maxdepth 4 -type f -print || true
            exit 1
          fi
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "Expected exactly one release MPP, found ${#artifacts[@]}" >&2
            printf '%s\n' "${artifacts[@]}" >&2
            exit 1
          fi
          test -s "${artifacts[0]}"
          dev_file="dev-mpp-output/Anixart-10.5-Dev-${GITHUB_RUN_NUMBER}.mpp"
          cp "${artifacts[0]}" "$dev_file"
          sha256sum "$dev_file" | tee dev-mpp-output/SHA256SUMS.txt
          printf 'Built MPP files:\n'
          ls -lh dev-mpp-output/*.mpp

      - name: Upload Dev MPP
        uses: actions/upload-artifact@v4
        with:
          name: Anixart-10.5-Dev-MPP
          path: dev-mpp-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
