name: Analyze Anixart APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    name: Extract and inspect DEX
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify APK is present
        run: |
          if [ ! -f analysis/Anixart_10.0.apk ]; then
            echo "::error::Missing analysis/Anixart_10.0.apk. Upload the APK to that repository path, then run this workflow again."
            exit 1
          fi
          sha256sum analysis/Anixart_10.0.apk

      - name: Extract APK and DEX files
        run: |
          mkdir -p analysis-output/extracted
          unzip -oq analysis/Anixart_10.0.apk -d analysis-output/extracted
          {
            echo "# APK inventory"
            echo
            sha256sum analysis/Anixart_10.0.apk
            echo
            echo '## DEX files'
            find analysis-output/extracted -maxdepth 1 -name 'classes*.dex' -printf '%f %s bytes\\n' | sort
            echo
            echo '## Relevant assets'
            find analysis-output/extracted/assets -maxdepth 2 -type f 2>/dev/null | grep -Ei 'adblock|player|kodik|ad' | sort || true
          } > analysis-output/APK-INVENTORY.md

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JADX
        run: |
          curl -fL --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          mkdir -p /tmp/jadx
          unzip -oq /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

      - name: Decompile APK
        run: |
          /tmp/jadx/bin/jadx --log-level WARN --threads-count 2 -d analysis-output/decompiled analysis/Anixart_10.0.apk 2>&1 | tee analysis-output/jadx.log

      - name: Build focused ad and player report
        if: always()
        run: |
          {
            echo "# Focused Anixart APK report"
            echo
            echo "APK SHA-256: $(sha256sum analysis/Anixart_10.0.apk 2>/dev/null | cut -d' ' -f1)"
            echo
            echo "## Candidate ad/player source files"
            if [ -d analysis-output/decompiled/sources ]; then
              grep -RilE 'KodikAdActivity|KODIK_URL|getKodikAdIframeUrl|getKodikIframeAd|YandexAds|ad_banner|ads_count|InterstitialAd|BannerAdView' analysis-output/decompiled/sources --include='*.java' 2>/dev/null | sed 's#analysis-output/decompiled/sources/##' | sort -u | head -500 || true
              echo
              echo "## Matching code excerpts"
              grep -RinE -C 3 'KodikAdActivity|KODIK_URL|getKodikAdIframeUrl|getKodikIframeAd|YandexAds|ad_banner|ads_count|InterstitialAd|BannerAdView' analysis-output/decompiled/sources --include='*.java' 2>/dev/null | head -3000 || true
            else
              echo "JADX source output is not available; see jadx.log."
            fi
          } > analysis-output/FOCUSED-REPORT.md

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anixart-10.0-apk-analysis
          path: analysis-output/
          if-no-files-found: warn
          retention-days: 14
