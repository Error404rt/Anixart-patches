name: Analyze Anixart APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "Anixart_10.0.apk"
      - ".github/workflows/analyze-anixart-apk.yml"

permissions:
  contents: read

jobs:
  analyze:
    name: Decode and inspect Anixart APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Download analysis tools
        run: |
          set -euxo pipefail
          mkdir -p tools
          curl -fsSL --retry 5 --retry-delay 2 \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip \
            -o tools/jadx.zip
          unzip -q tools/jadx.zip -d tools/jadx
          chmod +x tools/jadx/bin/jadx
          curl -fsSL --retry 5 --retry-delay 2 \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            -o tools/apktool.jar
          java -version
          tools/jadx/bin/jadx --version
          java -jar tools/apktool.jar --version

      - name: Verify APK
        run: |
          set -euxo pipefail
          test -s Anixart_10.0.apk
          mkdir -p analysis
          sha256sum Anixart_10.0.apk | tee analysis/sha256.txt
          unzip -l Anixart_10.0.apk > analysis/apk-zip-list.txt

      - name: Decode with Apktool
        run: |
          set -euxo pipefail
          java -Xmx4g -jar tools/apktool.jar d -f Anixart_10.0.apk -o analysis/apktool

      - name: Decompile with JADX
        run: |
          set -euxo pipefail
          mkdir -p analysis/jadx
          tools/jadx/bin/jadx -d analysis/jadx --show-bad-code Anixart_10.0.apk \
            > analysis/jadx.log 2>&1 || true

      - name: Extract structural and ad-related findings
        shell: bash
        run: |
          set -uo pipefail

          {
            echo "=== APK metadata ==="
            grep -nE 'package=|android:versionName=|android:versionCode=' \
              analysis/apktool/AndroidManifest.xml || true
            echo
            echo "=== Top-level DEX files ==="
            find analysis/apktool -maxdepth 2 -type f -name '*.dex' -print | sort || true
            echo
            echo "=== Ad/Kodik-related symbols ==="
            grep -RniE \
              --include='*.smali' \
              --include='*.java' \
              --include='*.kt' \
              'KodikInterface|advertEnded|onShowKodikAd|InterstitialAdLoader|InterstitialAd|DisplayCompat|getLayoutInflater|loadAd|->show\\(' \
              analysis/apktool analysis/jadx 2>/dev/null | head -n 5000 || true
            echo
            echo "=== Banner/ad resource strings ==="
            grep -RniE \
              --include='*.xml' \
              'Реклама|reklam|advert|banner|ads' \
              analysis/apktool/res 2>/dev/null | head -n 3000 || true
          } > analysis/findings.txt

          {
            echo "smali files: $(find analysis/apktool -type f -name '*.smali' | wc -l)"
            echo "JADX source files: $(find analysis/jadx -type f \\( -name '*.java' -o -name '*.kt' \\) | wc -l)"
            echo "resource XML files: $(find analysis/apktool/res -type f -name '*.xml' | wc -l)"
          } > analysis/statistics.txt

      - name: Build MPP
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload MPP
        uses: actions/upload-artifact@v6
        with:
          name: anixart-10.0-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error

      - name: Package analysis report
        run: |
          set -euxo pipefail
          mkdir -p analysis_bundle
          cp analysis/sha256.txt analysis_bundle/
          cp analysis/apk-zip-list.txt analysis_bundle/
          cp analysis/jadx.log analysis_bundle/ || true
          cp analysis/findings.txt analysis_bundle/
          cp analysis/statistics.txt analysis_bundle/
          cp -r analysis/apktool analysis_bundle/apktool
          cp -r analysis/jadx analysis_bundle/jadx
          tar -czf anixart-10.0-analysis.tar.gz analysis_bundle

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v6
        with:
          name: anixart-10.0-analysis
          path: anixart-10.0-analysis.tar.gz
          retention-days: 15
