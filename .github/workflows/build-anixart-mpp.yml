name: Build Anixart MPP

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  build:
    if: github.event.issue.title == 'BUILD ANIXART MPP'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify APK
        run: |
          set -euxo pipefail
          test -s Anixart_10.0.apk
          sha256sum Anixart_10.0.apk

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download analysis tools
        run: |
          set -euxo pipefail
          mkdir -p tools
          curl -fsSL --retry 5 --retry-delay 2 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o tools/jadx.zip
          unzip -q tools/jadx.zip -d tools/jadx
          chmod +x tools/jadx/bin/jadx
          curl -fsSL --retry 5 --retry-delay 2 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o tools/apktool.jar

      - name: Decode and decompile APK
        run: |
          set -euxo pipefail
          java -Xmx4g -jar tools/apktool.jar d -f Anixart_10.0.apk -o decoded
          mkdir -p decompiled
          tools/jadx/bin/jadx -d decompiled --show-bad-code Anixart_10.0.apk > jadx.log 2>&1 || true

      - name: Verify Anixart 10.0 patch anchors
        run: |
          set -euxo pipefail
          grep -R -n -m 5 'DisplayCompat' decoded decompiled
          grep -R -n -m 5 'KodikAdActivity' decoded decompiled
          grep -R -n -m 5 'onShowKodikAd' decoded decompiled
          grep -R -n -m 5 'InterstitialAdLoader' decoded decompiled
          grep -R -n -m 5 'InterstitialAd' decoded decompiled
          grep -R -n -m 5 'KodikInterface' decoded decompiled
          grep -R -n -m 5 'getLayoutInflater' decoded decompiled

      - name: Build MPP
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload MPP
        uses: actions/upload-artifact@v6
        with:
          name: Error404rt-Anixart-Patches-MPP
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 30
